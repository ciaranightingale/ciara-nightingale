<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="CN">
  <title>CN</title>
  <circle cx="50" cy="50" r="50" fill="#ffffff"/>
  <!-- A serif stack rather than outlined paths: unlike the site's display face,
       a Times-like serif ships with every OS, so this degrades to another
       newspaper serif instead of something off-brand. -->
  <text x="50" y="64.5"
        text-anchor="middle"
        font-family="Newsreader, 'Times New Roman', Times, Georgia, serif"
        font-size="44"
        font-weight="600"
        letter-spacing="1"
        fill="#16130f">CN</text>
</svg>
